<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить ресторан | Jess.</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f0f0f] text-gray-100 font-sans min-h-screen flex flex-col">

    <nav class="absolute top-0 left-0 w-full p-6 flex justify-between items-center z-50">
        <div class="flex items-center space-x-8">
            <a href="/" class="text-3xl font-black text-white tracking-tighter hover:text-gray-300 transition">Jess.</a>
            <a href="/" class="text-gray-400 hover:text-white font-medium flex items-center transition">
                <span class="mr-2">🏪</span> Рестораны
            </a>
        </div>
        <a href="/profile" class="px-6 py-2 bg-white/10 hover:bg-white/20 border border-white/10 text-white text-sm font-medium rounded-full transition-colors flex items-center gap-2">
            👤 Мой профиль
        </a>
    </nav>

    <div class="flex-grow flex items-center justify-center pt-24 pb-12 px-4">
        
        <div class="bg-[#141414]/90 backdrop-blur-xl border border-white/10 p-8 md:p-10 rounded-3xl shadow-2xl w-full max-w-2xl relative overflow-hidden">
            
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-32 bg-purple-600/20 blur-[80px] rounded-full pointer-events-none"></div>

            <div class="relative z-10">
                
                <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-6">
                    <h2 class="text-3xl font-bold text-white flex items-center tracking-tight">
                        <span class="mr-3 text-4xl">🍔</span> Новый ресторан
                    </h2>
                    <a href="/profile" class="text-sm text-gray-400 hover:text-white transition-colors flex items-center">
                        Отмена ✕
                    </a>
                </div>

                <form action="/api/restaurants/create" method="POST" class="space-y-6">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-2">Название заведения <span class="text-red-500">*</span></label>
                        <input type="text" name="name" required placeholder="Например: Burger King" 
                               class="w-full px-5 py-3.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-600 focus:border-purple-500 focus:bg-white/10 focus:outline-none transition-all focus:ring-2 focus:ring-purple-500/50">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-2">Описание</label>
                        <textarea name="description" rows="3" placeholder="Кратко о заведении: кухня, атмосфера, фишки..."
                                  class="w-full px-5 py-3.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-600 focus:border-purple-500 focus:bg-white/10 focus:outline-none transition-all focus:ring-2 focus:ring-purple-500/50"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-2">Адрес <span class="text-red-500">*</span></label>
                            <input type="text" name="address" required placeholder="ул. Ленина, 42" 
                                   class="w-full px-5 py-3.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-600 focus:border-purple-500 focus:bg-white/10 focus:outline-none transition-all focus:ring-2 focus:ring-purple-500/50">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-2">Время доставки <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <input type="number" name="delivery_time_mins" value="30" required min="5" max="180"
                                       class="w-full px-5 py-3.5 rounded-xl bg-white/5 border border-white/10 text-white focus:border-purple-500 focus:bg-white/10 focus:outline-none transition-all focus:ring-2 focus:ring-purple-500/50">
                                <span class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-500 font-medium pointer-events-none">мин.</span>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-2">Обложка ресторана (URL)</label>
                        <input type="url" name="image_url" placeholder="https://..." 
                               class="w-full px-5 py-3.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-600 focus:border-purple-500 focus:bg-white/10 focus:outline-none transition-all focus:ring-2 focus:ring-purple-500/50">
                        <p class="text-xs text-gray-500 mt-2 flex items-center">
                            <span class="mr-1">ℹ️</span> Скопируйте прямую ссылку на картинку (jpg/png) из интернета
                        </p>
                    </div>

                    <div class="pt-4 mt-2 border-t border-white/10">
                        <button type="submit" class="w-full py-4 bg-gradient-to-r from-purple-600 to-blue-600 text-white font-bold text-lg rounded-xl shadow-lg hover:from-purple-500 hover:to-blue-500 hover:shadow-purple-500/25 transition-all active:scale-[0.98]">
                            ✨ Запустить ресторан
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
