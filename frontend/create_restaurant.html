<div class="glass-panel p-8 rounded-3xl max-w-2xl mx-auto mt-10 text-white">
    <h2 class="text-2xl font-bold mb-6 flex items-center">
        <span class="text-purple-500 mr-3">🍔</span> Добавить новый ресторан
    </h2>

    <form action="/api/restaurants/create" method="POST" class="space-y-5">
        <div>
            <label class="block text-sm text-gray-300 mb-1">Название ресторана</label>
            <input type="text" name="name" required placeholder="Например: Burger King" 
                   class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-purple-500 focus:outline-none transition-colors">
        </div>

        <div>
            <label class="block text-sm text-gray-300 mb-1">Описание (необязательно)</label>
            <textarea name="description" rows="3" placeholder="Кратко о заведении..."
                      class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-purple-500 focus:outline-none transition-colors"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm text-gray-300 mb-1">Адрес</label>
                <input type="text" name="address" placeholder="ул. Пушкина, 42" 
                       class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-purple-500 focus:outline-none transition-colors">
            </div>
            <div>
                <label class="block text-sm text-gray-300 mb-1">Время доставки (мин)</label>
                <input type="number" name="delivery_time_mins" value="30" required 
                       class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-purple-500 focus:outline-none transition-colors">
            </div>
        </div>

        <div>
            <label class="block text-sm text-gray-300 mb-1">Ссылка на обложку (URL)</label>
            <input type="url" name="image_url" placeholder="https://example.com/image.jpg" 
                   class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-purple-500 focus:outline-none transition-colors">
            <p class="text-xs text-gray-500 mt-1">Скопируйте прямую ссылку на картинку из интернета</p>
        </div>

        <button type="submit" class="w-full py-4 mt-6 bg-gradient-to-r from-purple-600 to-blue-500 hover:from-purple-500 hover:to-blue-400 font-bold rounded-xl shadow-lg transition-all active:scale-95">
            Создать ресторан
        </button>
    </form>
</div>
