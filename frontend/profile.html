<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jess | Мой профиль</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-panel {
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)), url('/static/images/JessProfileHTML.avif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans text-gray-100">

    <nav class="glass-panel w-full p-4 flex justify-between items-center sticky top-0 z-50">
        <div class="text-2xl font-bold tracking-tight px-4">Jess.</div>
        <button onclick="logout()" class="px-5 py-2 text-sm text-gray-300 hover:text-white transition-colors border border-white/20 hover:bg-white/10 rounded-lg">
            Выйти
        </button>
    </nav>

    <main class="flex-grow flex flex-col items-center p-6 mt-10">
        <div class="glass-panel rounded-3xl p-8 w-full max-w-2xl">
            
            <div class="flex items-center space-x-6 mb-8 border-b border-white/10 pb-8">
                <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-gray-600 to-gray-400 flex items-center justify-center text-3xl font-bold text-white shadow-lg" id="avatarLetter">
                    </div>
                <div>
                    <h1 class="text-3xl font-bold" id="greetingName">Загрузка...</h1>
                    <p class="text-gray-400 mt-1" id="userEmailDisplay">загрузка email...</p>
                </div>
            </div>

            <div>
                <h2 class="text-xl font-semibold mb-4 flex items-center">
                    <span class="w-2 h-2 rounded-full bg-white mr-3"></span>
                    Мои заказы
                </h2>
                <div class="bg-white/5 rounded-2xl p-6 text-center border border-white/5">
                    <p class="text-gray-400 mb-4">У вас пока нет активных заказов.</p>
                    <button class="px-6 py-3 bg-white text-black font-semibold rounded-xl hover:bg-gray-200 transition-colors">
                        Выбрать ресторан
                    </button>
                </div>
            </div>

        </div>
    </main>

    <script>
        // Достаем данные пользователя из localStorage
        const userName = localStorage.getItem('userName') || 'Гость';
        const userEmail = localStorage.getItem('userEmail') || 'Нет email';

        // Подставляем данные в HTML
        document.getElementById('greetingName').textContent = userName;
        document.getElementById('userEmailDisplay').textContent = userEmail;
        
        // Берем первую букву имени для красивой аватарки
        document.getElementById('avatarLetter').textContent = userName.charAt(0).toUpperCase();

        // Функция выхода из аккаунта
        function logout() {
            // Очищаем память
            localStorage.removeItem('userName');
            localStorage.removeItem('userEmail');
            // Возвращаем на страницу регистрации
            window.location.href = '/register';
        }
    </script>
</body>
</html>
