services:
  db:
    image: postgis/postgis:15-3.3
    container_name: jess_db_container
    restart: always
    environment:
      POSTGRES_USER: jess_user
      POSTGRES_PASSWORD: jess_password
      POSTGRES_DB: jess_db
    ports:
      - "5433:5432"
    volumes:
      - jess_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jess_user -d jess_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jess_app_container
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: super_secret_jess_key_for_portfolio
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      DATABASE_URL: postgresql://jess_user:jess_password@db:5432/jess_db
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  jess_postgres_data: